<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gajian">
<meta name="theme-color" content="#1F5F4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<title>Gajian</title>
<style>
  /* ========= Gajian: "amplop gaji" =========
     Kertas uang (putih kehijauan) + tinta hijau tua. Warna kantong/kategori
     ngambil dari pecahan Rupiah. Satu elemen yang berani: amplop kantong. */
  :root {
    --paper: #ECF0EB;
    --sheet: #F9FBF8;
    --sunk: #E1E8E2;
    --ink: #14211D;
    --ink-2: #5A6A63;
    --rule: #D3DCD5;
    --accent: #1F5F4A;
    --on-accent: #F4F8F3;
    --accent-soft: #D4E5DB;
    --out: #B8314B;
    --in: #22764E;
    --warn: #A86E12;
    --statusbar: #1F5F4A;
    --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0E1A17; --sheet: #15241F; --sunk: #1B2E27; --ink: #E5EEE8; --ink-2: #93A69D; --rule: #26392F;
      --accent: #8BD3AE; --on-accent: #0E1A17; --accent-soft: #1D3A2D; --out: #FF8499; --in: #7BD8A3; --warn: #E8B45C;
      --statusbar: #0E1A17; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0E1A17; --sheet: #15241F; --sunk: #1B2E27; --ink: #E5EEE8; --ink-2: #93A69D; --rule: #26392F;
    --accent: #8BD3AE; --on-accent: #0E1A17; --accent-soft: #1D3A2D; --out: #FF8499; --in: #7BD8A3; --warn: #E8B45C;
    --statusbar: #0E1A17; color-scheme: dark;
  }
  /* nama lama yang masih dipakai di template JS */
  :root {
    --bg: var(--paper); --card: var(--sheet); --card2: var(--sunk); --text: var(--ink); --muted: var(--ink-2); --line: var(--rule);
    --soft: var(--accent-soft); --out-soft: color-mix(in srgb, var(--out) 13%, var(--sheet)); --in-soft: color-mix(in srgb, var(--in) 13%, var(--sheet));
    --shadow: none;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 104px);
    max-width: 560px; margin: 0 auto;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior-y: none; overflow-x: hidden;
  }
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: var(--statusbar); z-index: 50; }
  input, select, textarea, button { font: inherit; color: inherit; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; flex: none; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .spread { justify-content: space-between; }
  .neg { color: var(--out); }
  .posv { color: var(--in); }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  [data-fit] { white-space: nowrap; overflow: hidden; display: block; max-width: 100%; }
  .grow { flex: 1; min-width: 0; }

  /* ritme vertikal: blok yang numpuk selalu dapat jarak, nggak ada yang nempel */
  #view > * + *, .col-a > * + *, .col-b > * + * { margin-top: 16px; }
  #view > .sec, .col-a > .sec, .col-b > .sec { margin-top: 30px; }
  .col-a > .sec:first-child, .col-b > .sec:first-child { margin-top: 0; }
  .col-a + .col-b { margin-top: 30px; }

  /* permukaan */
  .card, .panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; }

  /* bagian atas halaman */
  .topbar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--rule); background: var(--sheet); display: grid; place-items: center; color: var(--ink); flex: none; }
  .pill { justify-self: center; border: 0; background: none; padding: 8px 6px; font-weight: 650; font-size: 16px; display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; flex: none; color: var(--ink); }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .page-head h1 { font-family: var(--display); font-size: 32px; font-weight: 750; letter-spacing: -.025em; margin: 0; line-height: 1.1; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .sec h2 { font-family: var(--display); font-size: 21px; font-weight: 700; letter-spacing: -.015em; margin: 0; min-width: 0; }
  .tag { border: 0; background: none; padding: 4px 0; font-size: 14px; font-weight: 600; display: inline-flex; gap: 3px; align-items: center; white-space: nowrap; flex: none; color: var(--accent); }
  .link-btn { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 4px 0; flex: none; }

  /* hero Beranda: jatah aman per hari sampai gajian */
  .hero { padding: 6px 2px 0; }
  .hero p { margin: 0; }
  .hero-k { font-size: 15px; color: var(--ink-2); }
  .hero-v { font-family: var(--display); font-size: 52px; font-weight: 760; letter-spacing: -.035em; line-height: 1.02; margin: 6px 0 8px !important; font-variant-numeric: tabular-nums; }
  .hero-v .per { font-size: .42em; font-weight: 600; letter-spacing: -.01em; color: var(--ink-2); margin-left: 4px; }
  .hero-s { font-size: 15px; }
  .hero .btn { margin-top: 16px; }
  .hero.small .hero-v { font-size: 38px; }
  .track { margin-top: 18px; display: grid; gap: 8px; }
  .track-row { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
  .track-row b { text-align: right; color: var(--ink); font-weight: 650; }
  .track .bar { margin: 0; height: 10px; }
  .track .bar.t i { background: var(--ink-2); }
  .track .bar.m i { background: var(--accent); }
  .track .bar.m.over i { background: var(--out); }
  .track-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); padding-left: 62px; padding-right: 50px; }
  .note { margin-bottom: 0; font-size: 14px; color: var(--ink-2); }
  .hero .note { margin-top: 10px; }
  .note b { color: var(--ink); }

  /* angka ringkas: tiga kolom tanpa kartu, dipisah garis */
  .figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .figs.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .figs > * { padding: 12px 10px 12px 0; min-width: 0; border: 0; background: none; text-align: left; display: block; }
  .figs > * + * { border-left: 1px solid var(--rule); padding-left: 12px; }
  .figs span { display: block; font-size: 13px; color: var(--ink-2); }
  .figs b { font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: -.01em; margin-top: 2px; }
  .figs > button.on { box-shadow: inset 0 -3px 0 var(--accent); }
  @media (max-width: 400px) {
    .figs:not(.two) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .figs:not(.two) > :nth-child(3) { grid-column: 1 / -1; border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); }
  }

  /* daftar transaksi: satu panel per hari, garis tipis antar baris */
  .day + .day { margin-top: 18px; }
  .dayhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 13px; color: var(--ink-2); font-weight: 600; margin: 0 2px 8px; }
  .dayhead .num { display: inline-flex; gap: 10px; }
  .txlist { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
  .tx, .wrow { display: flex; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; border: 0; background: none; text-align: left; min-width: 0; }
  .txlist > * + * { border-top: 1px solid var(--rule); }
  .mark { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; flex: none; background: color-mix(in srgb, var(--c, var(--ink-2)) 16%, var(--sheet)); }
  .mark.xfer { color: var(--accent); background: var(--accent-soft); }
  .tx-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .tx-title { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .tx-meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); min-width: 0; flex-wrap: wrap; row-gap: 2px; }
  .tx-meta .arrow { color: var(--ink-2); }
  .wtag { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; }
  .wtag i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tx-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; max-width: 48%; }
  .tx-amt { font-weight: 650; font-size: 15px; white-space: nowrap; }
  .tx-amt.xfer { color: var(--ink-2); }
  .tx-time { font-size: 12px; color: var(--ink-2); }
  @media (max-width: 360px) { .tx { gap: 10px; padding: 11px 12px; } .mark { width: 34px; height: 34px; font-size: 17px; } .tx-title, .tx-amt { font-size: 14px; } }
  .empty { text-align: center; padding: 28px 18px; color: var(--ink-2); font-size: 15px; border: 1.5px dashed var(--rule); border-radius: 16px; }
  .empty .btn { margin-top: 14px; width: auto; padding: 11px 18px; }

  /* titik akun dipakai di form */
  .wdot { width: 18px; height: 18px; border-radius: 6px; color: #fff; font-size: 8px; font-weight: 800; display: grid; place-items: center; flex: none; letter-spacing: -.02em; overflow: hidden; }
  .wbadge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); min-width: 0; flex: 1; }

  /* ===== amplop kantong ===== */
  .pockets { display: flex; gap: 12px; overflow-x: auto; margin-inline: -16px; padding: 4px 16px 8px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .pockets::-webkit-scrollbar { display: none; }
  .env { --c: var(--accent); position: relative; flex: 0 0 156px; height: 124px; scroll-snap-align: start; border: 1px solid color-mix(in srgb, var(--c) 35%, var(--rule)); border-radius: 12px; background: color-mix(in srgb, var(--c) 7%, var(--sheet)); overflow: hidden; text-align: left; padding: 0; color: var(--ink); }
  .env-fill { position: absolute; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--c) 24%, var(--sheet)); transition: height .5s cubic-bezier(.2,.8,.2,1); }
  .env-flap { position: absolute; left: 0; right: 0; top: 0; height: 52px; background: color-mix(in srgb, var(--c) 30%, var(--sheet)); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .env-flap::after { content: ""; position: absolute; left: 50%; top: 38px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--c); }
  .env-body { position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; flex-direction: column; gap: 1px; }
  .env-name { display: flex; gap: 5px; align-items: center; font-size: 13px; font-weight: 600; min-width: 0; }
  .env-v { font-family: var(--display); font-size: 19px; font-weight: 720; letter-spacing: -.015em; }
  .env-s { font-size: 12px; color: var(--ink-2); }
  .env.over { border-color: var(--out); border-style: dashed; }
  .env.over .env-v { color: var(--out); }
  .env.free { --c: var(--ink-2); border-style: dashed; background: transparent; }
  .env.free .env-flap { background: transparent; border: 0; clip-path: none; }
  .env.free .env-flap::after { display: none; }
  .env.add { flex-basis: 96px; display: grid; place-items: center; align-content: center; gap: 6px; color: var(--accent); font-weight: 600; font-size: 14px; border: 1.5px dashed var(--rule); background: transparent; }
  .prow { padding: 14px; border: 0; width: 100%; text-align: left; display: block; background: none; }
  .pinfo { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 9px 11px; border-radius: 10px; background: var(--sunk); font-size: 13px; }
  .chip .sub { font-size: 11px; color: var(--ink-2); font-weight: 400; margin-left: 2px; }
  .on .sub { color: inherit; opacity: .8; }

  /* ===== dompet ===== */
  .cards { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -16px; padding: 2px 16px 6px; scrollbar-width: none; }
  .cards::-webkit-scrollbar { display: none; }
  .wcard { flex: 0 0 78%; min-width: 0; scroll-snap-align: center; border-radius: 16px; padding: 16px 18px; color: #fff; min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; border: 0; text-align: left; position: relative; overflow: hidden; }
  .wcard > * { position: relative; min-width: 0; }
  .wcard .nm { font-size: 17px; font-weight: 700; }
  .wcard .bal { font-family: var(--display); font-size: 27px; font-weight: 720; letter-spacing: -.02em; }
  .actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .action { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: 1px solid var(--rule); border-radius: 14px; background: var(--sheet); font-size: 15px; font-weight: 600; color: var(--accent); min-width: 0; }
  .wrow > .wdot { width: 38px; height: 38px; border-radius: 11px; font-size: 10px; }
  .wrow .bal { font-weight: 650; white-space: nowrap; flex: none; text-align: right; }

  /* ===== kalender ===== */
  .cal { padding: 12px 8px; }
  .cal .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; text-align: center; }
  .cal .wd { font-size: 12px; color: var(--ink-2); font-weight: 600; padding-bottom: 6px; }
  .cal .d { border: 0; background: none; width: 100%; max-width: 44px; aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; justify-self: center; padding: 0; }
  .cal .d.today { box-shadow: inset 0 0 0 1.5px var(--ink); font-weight: 700; }
  .cal .d.sel { background: var(--ink); color: var(--paper); }
  .cal .dots { display: flex; gap: 3px; height: 5px; margin-top: 2px; }
  .cal .dots i { width: 5px; height: 5px; border-radius: 50%; }
  .cal .d.sel .dots i { background: var(--paper) !important; }
  .banner { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--rule); padding: 10px 8px 2px; margin-top: 8px; font-size: 14px; font-weight: 600; }
  .banner button { border: 0; background: none; color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; padding: 0; white-space: nowrap; flex: none; }

  /* ===== laporan ===== */
  .donut-wrap { padding: 18px; display: flex; flex-direction: column; align-items: center; }
  .legend { width: 100%; margin-top: 14px; }
  .legend .li { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-top: 1px solid var(--rule); font-size: 15px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend .v { white-space: nowrap; flex: none; text-align: right; }
  .budget .pct { font-size: 13px; font-weight: 650; flex: none; }
  .budget .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
  .bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
  .bar.warn i { background: var(--warn); }
  .bar.over i { background: var(--out); }
  .flow { padding: 16px 14px 12px; }
  .flow .bars { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: end; height: 140px; gap: 6px; }
  .flow .col { display: flex; gap: 3px; align-items: flex-end; justify-content: center; height: 100%; }
  .flow .col i { width: 12px; border-radius: 3px 3px 1px 1px; min-height: 2px; }
  .flow .lbls { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); text-align: center; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
  .flow .lbls .on { color: var(--ink); font-weight: 700; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); margin-bottom: 12px; }
  .keys span { display: inline-flex; align-items: center; gap: 6px; }
  .keys i { width: 10px; height: 10px; border-radius: 3px; }

  /* ===== nav bawah ===== */
  nav { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px); background: color-mix(in srgb, var(--sheet) 92%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--rule); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; z-index: 20; }
  nav .tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--ink-2); padding: 6px 0; min-width: 0; white-space: nowrap; font-weight: 500; }
  nav .tab.on { color: var(--ink); font-weight: 700; }
  nav .tab.on svg { stroke-width: 2.4; }
  .fab { justify-self: center; width: 54px; height: 46px; border-radius: 15px; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; transition: transform .2s; }
  .fab svg { transition: transform .2s; }
  .fab.open svg { transform: rotate(45deg); }
  .fab-menu { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 78px); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 19; pointer-events: none; }
  .fab-menu button { width: min(280px, 100%); height: 52px; border-radius: 14px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); display: flex; align-items: center; gap: 12px; padding: 0 18px; font-weight: 600; font-size: 16px; opacity: 0; transform: translateY(12px); transition: opacity .18s ease, transform .18s ease; }
  .fab-menu button svg { color: var(--accent); }
  .fab-menu button span { position: static; }
  .fab-menu.open { pointer-events: auto; }
  .fab-menu.open button { opacity: 1; transform: none; }
  .fab-menu.open button:nth-child(2) { transition-delay: .03s; }
  .fab-menu.open button:nth-child(3) { transition-delay: .06s; }
  .scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--paper) 70%, transparent); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); z-index: 18; opacity: 0; pointer-events: none; transition: opacity .18s; }
  .scrim.open { opacity: 1; pointer-events: auto; }

  /* ===== sheet / form ===== */
  .sheet-bg { position: fixed; inset: 0; background: rgba(8,20,16,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--paper); border-radius: 22px 22px 0 0; padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px); z-index: 41; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); max-height: 92vh; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
  .sheet.open { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 9px; background: var(--rule); margin: 0 auto 10px; }
  .sheet-head { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 8px; align-items: center; margin-bottom: 14px; }
  .sheet-head h3 { margin: 0; text-align: center; font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--sunk); border-radius: 12px; padding: 3px; margin-bottom: 14px; }
  .seg button { border: 0; background: none; padding: 9px 2px; border-radius: 10px; font-weight: 600; color: var(--ink-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg button.on { background: var(--sheet); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); }
  .field { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; min-width: 0; }

function normalize(d) {
  d.settings = { ...DEFAULT().settings, ...d.settings };
  d.deleted ||= {};
  if (!Array.isArray(d.categories) || !d.categories.length) {
    d.categories = structuredClone(DEFAULT_CATS);
    const legacy = { tagihan: 'listrik', investasi: 'investasi-in' };
    d.txs.forEach(t => { if (legacy[t.catId]) t.catId = legacy[t.catId]; });
  }
  if (!Array.isArray(d.pockets)) {
    const ids = new Set(d.categories.map(c => c.id));
    d.pockets = structuredClone(DEFAULT_POCKETS).map(p => ({ ...p, catIds: p.catIds.filter(id => ids.has(id)) }));
    // pindahin anggaran lama per kategori ke kantong
    const b = d.settings.budgets || {};
    Object.entries(b).forEach(([cid, v]) => {
      const p = d.pockets.find(p => p.catIds.includes(cid));
      if (p) p.amount += v;
      else { const c = d.categories.find(c => c.id === cid); if (c) d.pockets.push({ id: 'k-' + cid, kind: 'spend', icon: c.icon, name: c.name, color: c.color, amount: v, goal: 0, catIds: [cid] }); }
    });
    d.settings.budgets = {};
  }
  PROTECTED.forEach(id => { if (!d.categories.some(c => c.id === id)) d.categories.push(structuredClone(DEFAULT_CATS.find(c => c.id === id))); });
  return d;
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) {}
  return DEFAULT();
}
function saveLocal() {

const recJson = r => { const { u, ...rest } = r; return JSON.stringify(rest); };
const settingsJson = st => JSON.stringify(SYNC_SETTINGS.map(k => st[k]));
let snap = null;
function takeSnap() {
  snap = { settings: settingsJson(state.settings) };
  COLLS.forEach(k => { snap[k] = {}; state[k].forEach(r => snap[k][r.id] = recJson(r)); });
}
function stamp() {
  const now = Date.now();
  state.deleted ||= {};
  COLLS.forEach(k => {
    const seen = new Set();
    state[k].forEach(r => { seen.add(r.id); if (snap?.[k]?.[r.id] !== recJson(r)) r.u = now; });
    Object.keys(snap?.[k] || {}).forEach(id => { if (!seen.has(id)) state.deleted[k + ':' + id] = now; });
  });
  if (snap && snap.settings !== settingsJson(state.settings)) state.settings.u = now;
  takeSnap();
}

function balanceOf(w) {
  let b = w.initial || 0;
  for (const t of state.txs) {
    if (t.type === 'in' && t.walletId === w.id) b += t.amount;
    else if (t.type === 'out' && t.walletId === w.id) b -= t.amount;
    else if (t.type === 'transfer') {
      if (t.walletId === w.id) b -= t.amount;
      if (t.toWalletId === w.id) b += t.amount;
    }
  }
  return b;
}
const totalBalance = () => state.wallets.reduce((a, w) => a + balanceOf(w), 0);
const txsOfMonth = ym => state.txs.filter(t => t.date.startsWith(ymKey(ym)));
const sum = (txs, type) => txs.filter(t => t.type === type).reduce((a, t) => a + t.amount, 0);
const sortTx = txs => [...txs].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time) || b.created - a.created);
const usage = id => state.txs.filter(t => t.catId === id).length;
const pocketOf = catId => state.pockets.find(p => p.catIds.includes(catId));
const pocketById = id => state.pockets.find(p => p.id === id);
// Kantong sebuah pengeluaran: pilihan manual (pocketId; null = tanpa kantong),
// kalau nggak dipilih ikut kantong dari kategorinya.
function txPocket(t) {
  if (t.type !== 'out') return null;
  if (t.pocketId !== undefined) return t.pocketId ? pocketById(t.pocketId) || null : null;
  return pocketOf(t.catId) || null;
}
function pocketStats(p, ym = ui.ym) {
  const mine = t => t.type === 'out' && txPocket(t)?.id === p.id;
  const txs = txsOfMonth(ym).filter(mine);
  if (p.kind === 'save') {
    // kantong nabung: kategori isinya = setoran (+), pengeluaran lain yang diambil dari sini = penarikan (-)
    const isDep = t => p.catIds.includes(t.catId);
    const end = ymKey(ym) + '-31';
    const saved = state.txs.filter(t => mine(t) && t.date <= end).reduce((a, t) => a + (isDep(t) ? t.amount : -t.amount), 0);
    const used = txs.filter(isDep).reduce((a, t) => a + t.amount, 0);
    const taken = txs.filter(t => !isDep(t)).reduce((a, t) => a + t.amount, 0);
    return { txs, used, taken, left: p.amount - used, saved, pct: p.amount ? used / p.amount * 100 : 0 };
  }
  const used = sum(txs, 'out');
  return { txs, used, left: p.amount - used, saved: 0, pct: p.amount ? used / p.amount * 100 : 0 };
}
const allocated = () => state.pockets.reduce((a, p) => a + (p.amount || 0), 0);
const barCls = (pct, save) => save ? '' : pct > 100 ? 'over' : pct > 80 ? 'warn' : '';

function nextPayday() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const pd = state.settings.payday;
  const at = (y, m) => new Date(y, m, Math.min(pd, new Date(y, m + 1, 0).getDate()));
  let d = at(today.getFullYear(), today.getMonth());
  if (d <= today) d = at(today.getFullYear(), today.getMonth() + 1);
  return { date: d, days: Math.round((d - today) / 864e5) };
}

const TABLE = 'gajian_data';
let session = null, channel = null;
const syncInfo = { state: 'idle', at: null, err: '' };
let syncing = false, again = false, syncTimer = null;

// stringify dengan key urut, karena jsonb di Postgres ngacak urutan key
const stable = v => Array.isArray(v) ? '[' + v.map(stable).join(',') + ']'
  : v && typeof v === 'object' ? '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}'
  : JSON.stringify(v ?? null);

function mergeState(local, remote) {
  const deleted = { ...(remote.deleted || {}) };
  Object.entries(local.deleted || {}).forEach(([k, t]) => { if (!(deleted[k] >= t)) deleted[k] = t; });
  const out = { deleted };
  COLLS.forEach(k => {
    const L = new Map((local[k] || []).map(r => [r.id, r])), R = new Map((remote[k] || []).map(r => [r.id, r]));
    const alive = r => !(deleted[k + ':' + r.id] >= (r.u || 0));
    // urutan ikut cloud, data yang cuma ada di lokal diselipin setelah tetangganya
    const list = (remote[k] || []).map(r => { const l = L.get(r.id); return l && (l.u || 0) > (r.u || 0) ? l : r; });
    let prev = null;
    (local[k] || []).forEach(r => {
      if (!R.has(r.id)) { const i = prev ? list.findIndex(x => x.id === prev) : -1; list.splice(i + 1, 0, r); }
      prev = r.id;
    });
    out[k] = list.filter(alive);
  });
  const ls = local.settings || {}, rs = remote.settings || {};
  out.settings = { ...ls, ...((rs.u || 0) > (ls.u || 0) ? Object.fromEntries(SYNC_SETTINGS.concat('u').map(x => [x, rs[x]]).filter(([, v]) => v !== undefined)) : {}) };
  return out;
}

function setSync(st, err = '') {
  syncInfo.state = st; syncInfo.err = err;
  if (st === 'ok') syncInfo.at = new Date();
  ['#syncDot', '#syncDot2'].forEach(q => { const dot = $(q); if (dot) dot.dataset.s = st; });
  const lbl = $('#syncLbl'); if (lbl) lbl.textContent = syncText();
}
const syncText = () => ({ idle: 'Belum sinkron', syncing: 'Lagi sinkron…', ok: `Tersinkron ${syncInfo.at ? hm(syncInfo.at) : ''}`, error: `Gagal sinkron${syncInfo.err ? ': ' + syncInfo.err : ''}` })[syncInfo.state];

function scheduleSync(ms = 1200) {
  if (!sb || !session) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, ms);
}
async function sync() {
  if (!sb || !session) return;
  if (syncing) { again = true; return; }
  syncing = true; setSync('syncing');
  const uid = session.user.id;
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const { data: row, error } = await sb.from(TABLE).select('data,version').eq('user_id', uid).maybeSingle();
      if (error) throw error;
      const remote = row ? normalize(row.data) : null;
      const merged = remote ? normalize(mergeState(state, remote)) : state;
      if (!remote || stable(merged) !== stable(remote)) {
        if (!row) {
          const { error: e2 } = await sb.from(TABLE).insert({ user_id: uid, data: merged, version: 1 });
          if (e2) { if (e2.code === '23505') continue; throw e2; }
        } else {
          const { data: upd, error: e3 } = await sb.from(TABLE).update({ data: merged, version: row.version + 1, updated_at: new Date().toISOString() }).eq('user_id', uid).eq('version', row.version).select('version');
          if (e3) throw e3;
          if (!upd.length) continue; // keduluan perangkat lain, ulang tarik & gabung
        }
      }
      const changed = stable(merged) !== stable(state);
      state = merged; saveLocal(); takeSnap();
      if (changed) render();
      setSync('ok');
      return;
    }
    throw new Error('bentrok terus, coba lagi');
  } catch (e) {
    setSync('error', navigator.onLine ? (e.message || 'error') : 'offline');
  } finally {
    syncing = false;
    if (again) { again = false; scheduleSync(300); }
  }
}
function listenRemote() {
  if (channel) { sb.removeChannel(channel); channel = null; }
  if (!session) return;
  channel = sb.channel('gajian-' + session.user.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: TABLE, filter: `user_id=eq.${session.user.id}` }, () => scheduleSync(300))
    .subscribe();
}
if (sb) {
  sb.auth.onAuthStateChange((ev, s) => {
    const was = session?.user?.id;
    session = s;
    if (s && s.user.id !== was) { prefs.offline = false; savePrefs(); render(); sync(); listenRemote(); }
    if (!s && was) { listenRemote(); render(); }
  });
  addEventListener('online', () => scheduleSync(200));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleSync(200); });
  setInterval(() => { if (document.visibilityState === 'visible') scheduleSync(0); }, 60000);
}

const monthPill = () => `<button class="pill" data-act="month">${BULAN[ui.ym.m]} ${ui.ym.y}${ic('down', 16)}</button>`;
const wtag = w => w ? `<span class="wtag"><i style="background:${w.color}"></i><span class="ell">${esc(w.name)}</span></span>` : `<span class="wtag">Akun dihapus</span>`;

function txRow(t) {
  const w = walletOf(t.walletId);
  let mark, title, meta, amt, cls;
  if (t.type === 'transfer') {
    const to = walletOf(t.toWalletId);
    mark = `<span class="mark xfer">${ic('swap', 18)}</span>`;
    title = t.note || `Pindah ke ${to ? to.name : 'akun lain'}`;
    meta = `${wtag(w)}<span class="arrow" aria-label="ke">→</span>${wtag(to)}`;
    amt = rp(t.amount); cls = 'xfer';
  } else {
    const c = catOf(t.catId);
    mark = `<span class="mark" style="--c:${c.color}">${c.icon}</span>`;
    title = t.note || c.name;
    meta = `${t.note ? `<span>${esc(c.name)}</span>` : ''}${wtag(w)}`;
    amt = (t.type === 'in' ? '+' : '−') + rp(t.amount); cls = t.type === 'in' ? 'posv' : '';
  }
  return `<button class="tx" data-tx="${t.id}">${mark}
    <span class="tx-main"><span class="tx-title clamp2">${esc(title)}</span><span class="tx-meta">${meta}</span></span>
    <span class="tx-side"><span class="tx-amt num ${cls}" data-fit>${amt}</span><span class="tx-time num">${esc((t.time || '').replace(':', '.'))}</span></span>
  </button>`;
}

function dayLabel(dateStr) {
  const today = iso(new Date());
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (dateStr === today) return 'Hari ini';
  if (dateStr === iso(y)) return 'Kemarin';
  const d = parseD(dateStr);
  return `${DAYS[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]}`;
}
const DAYS = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

function txGroups(txs, emptyMsg, emptyBtn = '') {
  if (!txs.length) return `<div class="empty">${emptyMsg}${emptyBtn}</div>`;
  const groups = {};
  sortTx(txs).forEach(t => (groups[t.date] ||= []).push(t));
  return `<div>${Object.entries(groups).map(([date, list]) => {
    const i = sum(list, 'in'), o = sum(list, 'out');
    return `<section class="day"><header class="dayhead"><span>${dayLabel(date)}</span><span class="num">${i ? `<span class="posv">+${rp(i)}</span>` : ''}${o ? `<span>−${rp(o)}</span>` : ''}</span></header>
      <div class="txlist">${list.map(txRow).join('')}</div></section>`;
  }).join('')}</div>`;
}

// ---------- Beranda ----------
function paydayRange() {
  const np = nextPayday();
  const pd = state.settings.payday;
  const at = (y, m) => new Date(y, m, Math.min(pd, new Date(y, m + 1, 0).getDate()));
  const prev = at(np.date.getFullYear(), np.date.getMonth() - 1);
  const total = Math.max(1, Math.round((np.date - prev) / 864e5));
  return { ...np, prev, total, elapsed: total - np.days };
}
const dShort = d => `${d.getDate()} ${BLN[d.getMonth()]}`;

function hero(inc, out) {
  const left = inc - out;
  if (!sameYM(ui.ym, nowYM())) {
    return `<section class="hero">
      <p class="hero-k">Sisa uang ${BULAN[ui.ym.m]} ${ui.ym.y}</p>
      <p class="hero-v num ${left < 0 ? 'neg' : ''}" data-fit>${rp(left)}</p>
      <p class="hero-s muted">${inc ? `${Math.max(0, Math.round(left / inc * 100))}% pemasukan nggak kepakai` : 'Nggak ada pemasukan tercatat di bulan ini.'}</p>
    </section>`;
  }
  const r = paydayRange();
  if (!inc) {
    return `<section class="hero">
      <p class="hero-k">Gajian berikutnya ${dShort(r.date)}, ${r.days} hari lagi</p>
      <p class="hero-v" style="font-size:36px">Belum ada gaji bulan ini</p>
      <p class="hero-s muted">Catat gaji lo dulu biar jatah aman per harinya kehitung.</p>
      <button class="btn" data-act="add-salary" style="width:auto;padding:13px 22px">${ic('plus', 18, 2.4)} Catat gaji</button>
    </section>`;
  }
  const daily = Math.max(0, left) / Math.max(1, r.days);
  const tPct = Math.min(100, r.elapsed / r.total * 100);
  const mPct = Math.min(100, out / inc * 100);
  const ahead = mPct > tPct + 5;
  return `<section class="hero">
    <p class="hero-k">Jatah aman per hari sampai gajian</p>
    <p class="hero-v num ${left < 0 ? 'neg' : ''}" data-fit>${rp(daily)}<span class="per">/hari</span></p>
    <p class="hero-s">${left < 0 ? `<span class="neg">Udah minus ${rp(-left)} bulan ini.</span>` : `Sisa <b class="num">${rp(left)}</b> buat ${r.days} hari ke depan.`}</p>
    <div class="track" role="img" aria-label="Waktu berjalan ${Math.round(tPct)} persen, uang terpakai ${Math.round(mPct)} persen">
      <div class="track-row"><span>Waktu</span><div class="bar t"><i style="width:${tPct}%"></i></div><b class="num">${Math.round(tPct)}%</b></div>
      <div class="track-row"><span>Uang</span><div class="bar m ${ahead ? 'over' : ''}"><i style="width:${mPct}%"></i></div><b class="num">${Math.round(mPct)}%</b></div>
      <div class="track-ends"><span>Gajian ${dShort(r.prev)}</span><span>${dShort(r.date)}</span></div>
    </div>
    ${ahead ? `<p class="note">Uang kepake lebih cepat dari waktunya. Coba rem dikit sampai garisnya sejajar.</p>` : ''}
  </section>`;
}

function topSpend(txs, out) {
  if (!out) return '';
  const byCat = {};
  txs.filter(t => t.type === 'out').forEach(t => byCat[t.catId] = (byCat[t.catId] || 0) + t.amount);
  const [id, v] = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
  return `<p class="note">Paling banyak keluar buat <b>${esc(catOf(id).name)}</b>, ${Math.round(v / out * 100)}% dari pengeluaran.</p>`;
}

function pocketCard(p) {
  const st = pocketStats(p);
  const save = p.kind === 'save';
  let main, sub, fill, over = false;
  if (save) {
    main = rp(st.saved);
    fill = p.goal ? st.saved / p.goal * 100 : st.saved > 0 ? 100 : 0;
    sub = p.goal ? `dari target ${rp(p.goal)}` : 'terkumpul';
  } else if (p.amount) {
    main = rp(st.left);
    fill = Math.max(0, st.left / p.amount * 100);
    over = st.left < 0;
    sub = over ? 'kelewatan jatahnya' : `sisa dari ${rp(p.amount)}`;
  } else {
    main = rp(st.used); fill = 0; sub = 'kepake, belum ada jatah';
  }
  return `<button class="env ${over ? 'over' : ''}" data-pocket="${p.id}" style="--c:${p.color}" aria-label="Kantong ${esc(p.name)}, ${main}, ${sub}">
    <span class="env-fill" style="height:${Math.min(100, fill)}%"></span>
    <span class="env-flap"></span>
    <span class="env-body"><span class="env-name"><span>${p.icon}</span><span class="ell">${esc(p.name)}</span></span>
      <span class="env-v num" data-fit>${main}</span><span class="env-s ell">${sub}</span></span>
  </button>`;
}
function pocketStrip(inc) {
  const free = inc - allocated();
  const freeCard = inc ? `<button class="env free" data-act="mpockets" aria-label="Belum dibagi ke kantong, ${rp(free)}">
      <span class="env-body"><span class="env-name">Belum dibagi</span>
      <span class="env-v num ${free < 0 ? 'neg' : ''}" data-fit>${rp(free)}</span><span class="env-s ell">${free < 0 ? 'jatah lebih dari gaji' : 'dari pemasukan'}</span></span></button>` : '';
  return `<div class="pockets">${freeCard}${state.pockets.map(pocketCard).join('')}<button class="env add" data-act="newpocket">${ic('plus', 22)}<span>Kantong</span></button></div>`;
}

// ---------- Aktivitas ----------
function renderActivity() {
  const { y, m } = ui.ym;
  const txs = txsOfMonth(ui.ym);
  const byDay = {};
  txs.forEach(t => { const o = byDay[t.date] ||= { in: 0, out: 0, n: 0 }; o.n++; if (t.type === 'in') o.in++; if (t.type === 'out') o.out++; });
  const first = (new Date(y, m, 1).getDay() + 6) % 7;
  const days = new Date(y, m + 1, 0).getDate();
  const today = iso(new Date());
  let cells = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(d => `<div class="wd">${d}</div>`).join('');
  cells += '<div></div>'.repeat(first);
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${pad(m + 1)}-${pad(d)}`;
    const o = byDay[ds];
    const dots = o ? `${o.out ? '<i style="background:var(--out)"></i>' : ''}${o.in ? '<i style="background:var(--in)"></i>' : ''}${!o.in && !o.out ? '<i style="background:var(--ink-2)"></i>' : ''}` : '';
    cells += `<button class="d ${ds === today ? 'today' : ''} ${ds === ui.selDate ? 'sel' : ''}" data-day="${ds}" aria-label="${d} ${BULAN[m]}${o ? `, ${o.n} transaksi` : ''}">${d}<span class="dots">${dots}</span></button>`;
  }
  let list = ui.selDate ? txs.filter(t => t.date === ui.selDate) : txs;
  const inc = sum(list, 'in'), out = sum(list, 'out');
  if (ui.statFilter) list = list.filter(t => t.type === ui.statFilter);
  const sd = ui.selDate ? parseD(ui.selDate) : null;
  return `<div class="page-head"><h1>Aktivitas</h1>${monthPill()}</div>
    <div class="layout"><div class="col-a">
      <div class="panel cal"><div class="grid">${cells}</div>
        ${sd ? `<div class="banner"><span>${DAYS[sd.getDay()]}, ${sd.getDate()} ${BULAN[sd.getMonth()]}: ${byDay[ui.selDate]?.n || 0} transaksi</span><button data-act="clearday">Lihat sebulan</button></div>` : ''}
      </div>
      <div class="figs two">
        <button class="${ui.statFilter === 'out' ? 'on' : ''}" data-stat="out"><span>Keluar</span><b class="num" data-fit>${rp(out)}</b></button>
        <button class="${ui.statFilter === 'in' ? 'on' : ''}" data-stat="in"><span>Masuk</span><b class="num posv" data-fit>${rp(inc)}</b></button>
      </div>
    </div>
    <div class="col-b">${txGroups(list, ui.selDate ? 'Nggak ada transaksi di tanggal ini.' : `Belum ada transaksi di ${BULAN[ui.ym.m]}.`)}</div></div>`;
}

// ---------- Laporan ----------
function renderReport() {
  const txs = txsOfMonth(ui.ym);
  const out = sum(txs, 'out'), inc = sum(txs, 'in');
  const byCat = {};
  txs.filter(t => t.type === 'out').forEach(t => byCat[t.catId] = (byCat[t.catId] || 0) + t.amount);
  const rows = Object.entries(byCat).map(([id, v]) => ({ c: catOf(id), v })).sort((a, b) => b.v - a.v);

  const R = 62, C = 2 * Math.PI * R;
  let acc = 0;
  const segs = rows.map(r => {
    const len = r.v / out * C;
    const gap = rows.length > 1 ? Math.min(3, len / 2) : 0;
    const s = `<circle r="${R}" cx="80" cy="80" fill="none" stroke="${r.c.color}" stroke-width="18" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"/>`;
    acc += len;
    return s;
  }).join('');
  const centerTxt = rp(out);
  const cfs = centerTxt.length > 14 ? 11 : centerTxt.length > 11 ? 13 : 15;
  const donut = out ? `<div class="panel donut-wrap">
      <svg width="170" height="170" viewBox="0 0 160 160" role="img" aria-label="Pengeluaran per kategori"><circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--sunk)" stroke-width="18"/>${segs}
      <text x="80" y="74" text-anchor="middle" font-size="11" fill="var(--ink-2)">Keluar</text>
      <text x="80" y="94" text-anchor="middle" font-size="${cfs}" font-weight="700" fill="var(--ink)" style="font-family:var(--display)">${esc(centerTxt)}</text></svg>
      <div class="legend">${rows.map(r => `<div class="li"><span class="sw" style="background:${r.c.color}"></span><span class="clamp2 grow" style="line-height:1.3">${r.c.icon} ${esc(r.c.name)}</span><span class="v num"><b>${rp(r.v)}</b> <span class="muted small">${Math.round(r.v / out * 100)}%</span></span></div>`).join('')}</div>
    </div>` : `<div class="empty">Belum ada pengeluaran di ${BULAN[ui.ym.m]}.</div>`;

  const pocketHtml = state.pockets.length ? `<div class="txlist">${state.pockets.map(p => {
    const st = pocketStats(p);
    const save = p.kind === 'save';
    const pct = save ? (p.goal ? st.saved / p.goal * 100 : p.amount ? st.used / p.amount * 100 : 0) : st.pct;
    const foot = save
      ? `<span>Bulan ini ${rp(st.used)}${p.amount ? ' dari ' + rp(p.amount) : ''}</span><span>Terkumpul ${rp(st.saved)}${p.goal ? ' dari ' + rp(p.goal) : ''}</span>`
      : p.amount ? `<span>${rp(st.used)} dari ${rp(p.amount)}</span>${st.left < 0 ? `<span class="neg">Lewat ${rp(-st.left)}</span>` : `<span>Sisa ${rp(st.left)}</span>`}`
      : `<span>Kepake ${rp(st.used)}</span><span>Belum ada jatah</span>`;
    return `<button class="budget prow" data-pocket="${p.id}">
      <div class="row spread"><span class="ell grow"><span>${p.icon}</span> <b>${esc(p.name)}</b></span><span class="pct num ${!save && pct > 100 ? 'neg' : 'muted'}">${Math.round(pct)}%</span></div>
      <div class="bar ${barCls(pct, save)}"><i style="width:${Math.min(100, pct)}%;background:${save ? 'var(--in)' : pct > 100 ? 'var(--out)' : p.color}"></i></div>
      <div class="foot num">${foot}</div></button>`;
  }).join('')}</div>` : `<div class="empty">Belum ada kantong.</div>`;

  const months = [-5, -4, -3, -2, -1, 0].map(n => shiftYM(ui.ym, n));
  const flows = months.map(ym => { const t = txsOfMonth(ym); return { ym, in: sum(t, 'in'), out: sum(t, 'out') }; });
  const max = Math.max(1, ...flows.map(f => Math.max(f.in, f.out)));
  const flow = `<div class="panel flow">
    <div class="keys"><span><i style="background:var(--in)"></i>Masuk</span><span><i style="background:var(--ink-2)"></i>Keluar</span></div>
    <div class="bars" role="img" aria-label="Pemasukan dan pengeluaran 6 bulan terakhir">${flows.map(f => `<div class="col"><i style="height:${f.in / max * 100}%;background:var(--in)"></i><i style="height:${f.out / max * 100}%;background:var(--ink-2)"></i></div>`).join('')}</div>
    <div class="lbls">${flows.map(f => `<span class="${sameYM(f.ym, ui.ym) ? 'on' : ''}">${BLN[f.ym.m]}</span>`).join('')}</div>
  </div>`;

  const saveRate = inc ? Math.round((inc - out) / inc * 100) : null;
  return `<div class="page-head"><h1>Laporan</h1>${monthPill()}</div>
    <div class="layout"><div class="col-a">
      <div class="figs two">
        <div><span>Selisih bulan ini</span><b class="num ${inc - out < 0 ? 'neg' : 'posv'}" data-fit>${rp(inc - out)}</b></div>
        <div><span>Yang kesimpen</span><b class="num" data-fit>${saveRate === null ? '–' : saveRate + '% dari gaji'}</b></div>
      </div>
      <div class="sec"><h2>Per kategori</h2><button class="link-btn" data-act="mcat-out">Kelola</button></div>${donut}
    </div>
    <div class="col-b"><div class="sec"><h2>Kantong</h2><button class="link-btn" data-act="mpockets">Atur</button></div>${pocketHtml}
      <div class="sec"><h2>6 bulan terakhir</h2></div>${flow}</div></div>`;
}

let draft = null;
function openTx(tx, title) {
  const now = new Date();
  draft = tx ? { ...tx } : { id: null, type: 'out', amount: 0, catId: topCats('out', 1)[0]?.id || 'makan', walletId: state.wallets[0]?.id, toWalletId: state.wallets[1]?.id, note: '', date: iso(now), time: hm(now) };
  draft._title = title || (draft.id ? 'Edit Transaksi' : 'Catat Transaksi');
  draft._pocketManual = draft.pocketId !== undefined;
  renderTxSheet();
}
// kategori yang paling sering dipakai muncul duluan
function topCats(kind, n) {
  const count = {};
  state.txs.forEach(t => { if (t.catId) count[t.catId] = (count[t.catId] || 0) + 1; });
  const list = catsOf(kind);

const draftPocket = () => draft._pocketManual ? (draft.pocketId ? pocketById(draft.pocketId) || null : null) : pocketOf(draft.catId) || null;
// sisa kantong sebelum transaksi ini (kalau lagi edit, nominal lamanya dibalikin dulu)
function pocketBefore(p) {
  const dt = parseD(draft.date || iso(new Date()));
  const ym = { y: dt.getFullYear(), m: dt.getMonth() };
  const st = pocketStats(p, ym);
  const orig = draft.id && state.txs.find(t => t.id === draft.id);
  if (orig && txPocket(orig)?.id === p.id && orig.date.startsWith(ymKey(ym))) {
    const dep = p.kind === 'save' && p.catIds.includes(orig.catId);
    if (p.kind === 'save') st.saved -= dep ? orig.amount : -orig.amount;
    else st.left += orig.amount;
  }
  return st;
}
function pocketField() {
  const cur = draftPocket();
  const chips = state.pockets.map(p => {
    const st = pocketBefore(p);
    const sub = p.kind === 'save' ? rp(st.saved) : p.amount ? `sisa ${rp(st.left)}` : 'tanpa jatah';
    return `<button class="chip ${cur?.id === p.id ? 'on' : ''}" data-pk="${p.id}">${p.icon} ${esc(p.name)}<span class="sub ${p.kind !== 'save' && p.amount && st.left < 0 ? 'neg' : ''}">${sub}</span></button>`;
  }).join('');
  return `<div class="lbl"><span>Ambil dari kantong</span><span>${draft._pocketManual ? `<button class="link-btn" data-act="pk-auto">Ikut kategori</button>` : 'otomatis dari kategori'}</span></div>
    <div class="chips">${chips}<button class="chip ${!cur ? 'on' : ''}" data-pk="">Tanpa kantong</button></div>
    <div id="pinfo">${pocketInfo()}</div>`;
}
function pocketInfo() {
  if (draft.type !== 'out') return '';
  const p = draftPocket();
  const amt = draft.amount || 0;
  if (!p) return `<div class="pinfo muted">${draft._pocketManual ? 'Nggak motong kantong mana pun.' : 'Kategori ini belum masuk kantong. Pilih kantongnya di atas biar sisanya kepotong.'}</div>`;
  const st = pocketBefore(p);
  let txt;
  if (p.kind === 'save') {
    const dep = p.catIds.includes(draft.catId);
    const after = st.saved + (dep ? amt : -amt);
    txt = `${dep ? 'Tabungan nambah' : 'Tabungan berkurang'} jadi <b class="num ${after < 0 ? 'neg' : ''}">${rp(after)}</b>`;
  } else if (!p.amount) {
    txt = `Kantong <b>${esc(p.name)}</b> belum ada jatahnya`;
  } else {
    const after = st.left - amt;
    txt = after < 0
      ? `<span class="neg">Kantong <b>${esc(p.name)}</b> bakal kelewatan <b class="num">${rp(-after)}</b></span>`
      : `Sisa kantong <b>${esc(p.name)}</b>: <span class="num">${rp(st.left)}</span>${amt ? ` → <b class="num">${rp(after)}</b>` : ''}`;
  }
  return `<div class="pinfo"><span>${p.icon}</span><span class="grow">${txt}</span></div>`;

  if (d.type === 'transfer') {

    if (d.toWalletId === d.walletId) { toast('Akun asal & tujuan nggak boleh sama'); return; }
  }
  const clean = { id: d.id || uid(), type: d.type, amount: d.amount, walletId: d.walletId, note: d.note, date: d.date, time: d.time, created: d.created || Date.now() };

const hasWord = (t, k) => new RegExp(`(^|[^\\p{L}\\p{N}])${reEsc(k)}(?=$|[^\\p{L}\\p{N}])`, 'u').test(t);
// cari kategori dengan kata kunci terpanjang yang cocok
function matchCat(t, kind) {
  let best = null, bl = 0;
  for (const c of state.categories) {
    if (kind && c.kind !== kind) continue;
    if (PROTECTED.includes(c.id)) continue;
    const keys = [c.name.toLowerCase(), ...(c.keywords || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean)];
    for (const k of keys) if (k.length > bl && hasWord(t, k)) { best = c; bl = k.length; }
  }
  return best;
}
function parseAmount(t) {
  const re = /(\d+(?:[.,]\d+)*)\s*(rb|ribu|k|jt|juta)?(?![\w])/g;
  let best = 0, m;
  while ((m = re.exec(t))) {
    let [, num, unit] = m, v;
    if (unit) {
      v = parseFloat(num.replace(/\.(?=\d{3}\b)/g, '').replace(',', '.'));
      v *= /jt|juta/.test(unit) ? 1e6 : 1e3;
    } else {
      v = Number(num.replace(/[.,]/g, ''));
    }
    if (v > best) best = v;
  }
  return Math.round(best);
}
function findWallets(t) {
  const hits = [];
  state.wallets.forEach(w => {
    const names = [w.name.toLowerCase(), w.name.toLowerCase().replace(/^(bank|dompet)\s+/, '')];
    if (w.type === 'cash') names.push('tunai', 'cash');
    let pos = -1;
    names.forEach(n => {
      if (n.length < 2) return;
      const mm = new RegExp(`(^|[^\\p{L}\\p{N}])${reEsc(n)}(?=$|[^\\p{L}\\p{N}])`, 'u').exec(t);
      if (mm && (pos < 0 || mm.index < pos)) pos = mm.index;
    });
    if (pos >= 0) hits.push({ w, pos });
  });
  return hits.sort((a, b) => a.pos - b.pos).map(h => h.w);
}
function quickParse() {
  const raw = ($('#quickText').value || '').trim();
  if (!raw) { toast('Ketik atau ngomong dulu'); return; }
  const t = raw.toLowerCase();
  const now = new Date();
  const ws = findWallets(t);
  let type = 'out', catId = 'lain';
  if (/(^|\s)(transfer|tf|pindah|isi saldo|top ?up)(\s|$)/.test(t) && ws.length >= 2) type = 'transfer';
  else {
    let c = matchCat(t);
    if (/(^|\s)(terima|nerima|dapat|dapet|masuk|dibayar|cair)(\s|$)/.test(t) && (!c || c.kind === 'out')) c = matchCat(t, 'in') || catOf('lain-in');
    if (c) { type = c.kind; catId = c.id; }
  }
  const date = new Date(now);
  if (/(^|\s)kemarin(\s|$)/.test(t)) date.setDate(date.getDate() - 1);
  let note = raw
    .replace(/(\d+(?:[.,]\d+)*)\s*(rb|ribu|k|jt|juta)?(?![\w])/gi, '')
    .replace(/(^|\s)(pakai|pake|via|dari|ke|lewat|kemarin|hari ini|rp|rupiah|sebesar)(?=\s|$)/gi, ' ');
  ws.forEach(w => { note = note.replace(new RegExp(`(^|\\s)${reEsc(w.name.replace(/^(bank|dompet)\s+/i, ''))}(?=\\s|$)`, 'gi'), ' '); });
  note = note.replace(/(^|\s)(tunai|cash)(?=\s|$)/gi, ' ').replace(/\s+/g, ' ').trim();
  note = note.charAt(0).toUpperCase() + note.slice(1);
  // "... dari kantong nongkrong" -> pilih kantong itu
  let pocketId;
  const km = t.match(/kantong\s+([\p{L}\p{N}]+)/u);
  if (km) {
    const p = state.pockets.find(p => p.name.toLowerCase().startsWith(km[1])) || state.pockets.find(p => p.name.toLowerCase().includes(km[1]));
    if (p) { pocketId = p.id; note = note.replace(new RegExp(`(^|\\s)kantong\\s+${reEsc(km[1])}`, 'i'), ' ').replace(/\s+/g, ' ').trim(); note = note.charAt(0).toUpperCase() + note.slice(1); }
  }
  const fromId = ws[0]?.id || state.wallets[0]?.id;
  draft = {
    id: null, type, amount: parseAmount(t), catId,
    walletId: fromId,
    toWalletId: type === 'transfer' ? ws[1]?.id : state.wallets.find(w => w.id !== fromId)?.id,
    note, date: iso(date), time: hm(now), _title: 'Konfirmasi Transaksi',
    ...(pocketId ? { pocketId, _pocketManual: true } : { _pocketManual: false }),
  };
  renderTxSheet();
}

// ================= events =================
document.addEventListener('click', e => {
  const el = e.target.closest('button, [data-tx], [data-wallet]');
  if (!el) return;
  const ds = el.dataset;
  const markOn = () => el.parentElement.querySelectorAll(':scope > button').forEach(b => b.classList.toggle('on', b === el));

  if (ds.tab) { ui.tab = ds.tab; ui.selDate = null; ui.statFilter = null; toggleFab(false); render(); scrollTop(); return; }
  if (ds.tabGo) { ui.tab = ds.tabGo; render(); scrollTop(); return; }
  if (ds.tx) { const t = state.txs.find(x => x.id === ds.tx); if (t) openTx(t); return; }
  if (ds.wallet) { openWallet(walletOf(ds.wallet)); return; }
  if (ds.mwallet) { openWallet(walletOf(ds.mwallet), openManageWallets, openManageWallets); return; }
  if (ds.day) { ui.selDate = ui.selDate === ds.day ? null : ds.day; render(); return; }
  if (ds.stat) { ui.statFilter = ui.statFilter === ds.stat ? null : ds.stat; render(); return; }
  if (ds.filter) { ui.filter = ds.filter; closeSheet(); return; }
  if (ds.year) { openMonth.shift(Number(ds.year)); return; }
  if (ds.m) { const [y, m] = ds.m.split('-').map(Number); ui.ym = { y, m }; ui.selDate = null; closeSheet(); return; }
  if (ds.theme) { prefs.theme = ds.theme; savePrefs(); applyTheme(); markOn(); return; }

  // form transaksi
  if (ds.type) { syncDraft(); draft.type = ds.type; if (ds.type === 'transfer' && state.wallets.length < 2) toast('Tambah minimal 2 akun dulu buat transfer'); renderTxSheet(); return; }
  if (ds.c) { draft.catId = ds.c; el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); refreshPocket(); return; }
  if (ds.pk !== undefined) { draft._pocketManual = true; draft.pocketId = ds.pk || null; refreshPocket(); return; }
  if (ds.w) { const [k, id] = ds.w.split(':'); draft[k] = id; el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); return; }
  if (ds.add !== undefined) { const a = $('#amt'); const n = Number(ds.add); a.value = fmtNum(n ? digits(a.value) + n : 0); draft.amount = digits(a.value); if ($('#pinfo')) $('#pinfo').innerHTML = pocketInfo(); return; }
  if (ds.pick) { draft.catId = ds.pick; renderTxSheet(); return; }

  // form kategori
  if (ds.emoji) { $('#cIcon').value = ds.emoji; el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); return; }
  if (ds.ccolor) { cdraft.color = ds.ccolor; el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); return; }
  if (ds.ckind) { syncCat(); cdraft.kind = ds.ckind; renderCatForm(); return; }
  if (ds.mkind) { openManageCats(ds.mkind, !!backFn); return; }
  if (ds.editcat) { const fs = !!backFn; const c = catOf(ds.editcat); openCatForm(c, c.kind, () => openManageCats(mKind, fs), () => openManageCats(mKind, fs)); return; }

  // kantong
  if (ds.pocket) { openPocketDetail(ds.pocket); return; }
  if (ds.editpocket) { const fromList = !!$('#sheet .menu-list [data-editpocket]'); const fs = !!backFn; openPocketForm(pocketById(ds.editpocket), fromList ? () => openManagePockets(fs) : null); return; }
  if (ds.pkind) { syncPocket(); pdraft.kind = ds.pkind; renderPocketForm(); return; }
  if (ds.pemoji) { $('#pIcon').value = ds.pemoji; el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); return; }
  if (ds.pcolor) { pdraft.color = ds.pcolor; markOn(); return; }
  if (ds.pcat) {
    const i = pdraft.catIds.indexOf(ds.pcat);
    if (i >= 0) pdraft.catIds.splice(i, 1); else pdraft.catIds.push(ds.pcat);
    el.classList.toggle('on', i < 0);
    el.closest('.field').querySelector('.lbl span:last-child').textContent = `${pdraft.catIds.length} dipilih`;
    return;
  }
  if (ds.ppct) { const inc = sum(txsOfMonth(nowYM()), 'in'); $('#pAmt').value = fmtNum(Math.round(inc * Number(ds.ppct) / 100 / 1000) * 1000); return; }
  if (ds.pset) { $('#pAmt').value = fmtNum(Number(ds.pset)); return; }

  // form akun
  if (ds.preset !== undefined) { syncW(); const p = PRESETS[ds.preset]; Object.assign(wdraft, { name: p.name, type: p.type, color: p.color, note: wdraft.note || (p.type === 'cash' ? 'Pegangan Harian' : p.type === 'ewallet' ? 'Kebutuhan Harian' : p.type === 'bank' ? 'Rekening Utama' : '') }); renderWalletSheet(); return; }
  if (ds.wnote) { $('#wNote').value = ds.wnote; return; }
  if (ds.wtype) { wdraft.type = ds.wtype; markOn(); return; }
  if (ds.color) { wdraft.color = ds.color; markOn(); return; }

  if (ds.amode) { authMode = ds.amode; render(); return; }
  switch (ds.act) {
    case 'offline': prefs.offline = true; savePrefs(); render(); break;
    case 'login': prefs.offline = false; savePrefs(); closeSheet(); break;
    case 'syncnow': sync(); break;
    case 'signout': signOut(); break;
    case 'fab': toggleFab(); break;
    case 'manual': toggleFab(false); openTx(); break;
    case 'add-salary': openTx(); draft.type = 'in'; draft.catId = 'gaji'; draft.note = `Gaji ${BULAN[new Date().getMonth()]}`; renderTxSheet(); break;
    case 'voice': toggleFab(false); openVoice(); break;
    case 'transfer':
      toggleFab(false);
      if (state.wallets.length < 2) { toast('Tambah minimal 2 akun dulu'); ui.tab = 'wallet'; render(); break; }
      openTx(); draft.type = 'transfer'; renderTxSheet(); break;
    case 'mic': toggleMic(); break;
    case 'pk-auto': draft._pocketManual = false; delete draft.pocketId; refreshPocket(); break;
    case 'parse': stopVoice(); quickParse(); break;
    case 'close': closeSheet(); break;
    case 'back': backFn ? backFn() : closeSheet(); break;
    case 'savetx': saveTx(); break;
    case 'deltx':
      if (!confirm('Hapus transaksi ini?')) break;
      state.txs = state.txs.filter(t => t.id !== draft.id); save(); closeSheet(); toast('Transaksi dihapus'); break;
    case 'pickcat': openCatPicker(); break;
    case 'pick-newcat': {
      const kind = draft.type === 'in' ? 'in' : 'out';
      openCatForm(null, kind, id => { if (id) { const c = catOf(id); draft.type = c.kind; draft.catId = id; } renderTxSheet(); }, openCatPicker);
      if (pickQuery) $('#cName').value = pickQuery.charAt(0).toUpperCase() + pickQuery.slice(1);
      break;
    }
    case 'tx-newwallet': {
      syncDraft();
      const key = ds.key;
      openWallet(null, id => { if (id) draft[key] = id; renderTxSheet(); }, renderTxSheet);
      break;
    }
    case 'savecat': saveCat(); break;
    case 'delcat': deleteCat(); break;
    case 'mcat-out': openManageCats('out', !!$('#sPayday')); break;
    case 'mcat-in': openManageCats('in', true); break;
    case 'm-newcat': { const fs = !!backFn; openCatForm(null, mKind, () => openManageCats(mKind, fs), () => openManageCats(mKind, fs)); break; }
    case 'mwallet': openManageWallets(); break;
    case 'mpockets': openManagePockets(!!$('#sPayday')); break;
    case 'newpocket': { const inList = !!$('#sheet.open .menu-list [data-editpocket]'); const fs = !!backFn; openPocketForm(null, inList ? () => openManagePockets(fs) : null); break; }
    case 'savepocket': savePocket(); break;
    case 'delpocket': deletePocket(); break;
    case 'm-newwallet': openWallet(null, openManageWallets, openManageWallets); break;
    case 'addwallet': openWallet(); break;
    case 'savewallet': saveWallet(); break;
    case 'delwallet': deleteWallet(); break;
    case 'hide': prefs.hide = !prefs.hide; savePrefs(); render(); break;
    case 'month': openMonth(); break;
    case 'filter': openFilter(); break;
    case 'clearday': ui.selDate = null; render(); break;
    case 'settings': openSettings(); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'reset':
      if (!confirm(`Semua akun, transaksi, kategori, dan pengaturan bakal dihapus${session ? ' (termasuk di cloud & perangkat lain)' : ''}. Yakin?`)) break;
      if (!confirm('Beneran? Ini nggak bisa dibatalin.')) break;
      state = DEFAULT(); save(); applyTheme(); closeSheet(); toast('Data dihapus'); break;
  }
});
$('#sheetBg').addEventListener('click', closeSheet);

document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-money]')) el.value = fmtNum(digits(el.value));
  if (el.id === 'amt' && draft) { draft.amount = digits(el.value); if ($('#pinfo')) $('#pinfo').innerHTML = pocketInfo(); }
  if (el.id === 'catSearch') {
    pickQuery = el.value.trim();
    $('#catGrid').innerHTML = catGrid(draft.type === 'in' ? 'in' : 'out');
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'date' && draft && $('#pfield')) { draft.date = el.value || iso(new Date()); refreshPocket(); }
  if (el.id === 'sPayday') {
    state.settings.payday = Math.min(31, Math.max(1, parseInt(el.value) || 1));
    el.value = state.settings.payday; save(); render(); toast(`Tanggal gajian: ${state.settings.payday}`);
  }
  if (el.id === 'importFile') {
    const file = el.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data.settings || !Array.isArray(data.wallets) || !Array.isArray(data.txs)) throw 0;
      if (!confirm(`Pulihkan backup berisi ${data.txs.length} transaksi & ${data.wallets.length} akun? Data sekarang bakal diganti.`)) return;
      state = normalize(data);
      save(); applyTheme(); closeSheet(); toast('Backup dipulihkan');
    } catch { toast('File backup nggak valid'); }
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet(); });

takeSnap();
if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('pwa');
applyTheme();
render();
if (sb) sb.auth.getSession().then(({ data }) => { if (!session && data.session) { session = data.session; render(); sync(); listenRemote(); } else if (!data.session) render(); });

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
